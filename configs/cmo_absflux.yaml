run:      {tag: cmo_af, seed: 0, out: results}
data:     {path: data/adr2d/adr2d.h5, N: 64, K: 4, num_workers: 0, batch_size: 16,
           epoch_windows: 4096, val_windows: 1024}
# Same separation as `default.yaml` (block averaging + spectral coarse solve +
# wavelet detail + gate); the only change is the coarse flux parametrisation:
# `absolute` = FluxNet's bounded face amount (tanh(F) * 0.5 * upwind mass, dt/dx
# absorbed in the bound). This is the missing cell of the 2x2 in dev_log 2026-11-01.
model:    {name: cmo, block: 2, coarse_width: 16, modes: 12, n_layers: 4,
           wave_width: 32, wavelet: db2, use_separation: true, use_projection: true,
           flux_form: absolute,
           gate: {beta_init: 4.0, tau_init: 0.1}}
training: {lr: 1.0e-3, weight_decay: 0.0, gamma1: 1.0, gamma2: 0.5, use_detail: true,
           epochs: 200, budget_min: 25, patience: 8, amp: true, grad_clip: 1.0}
eval:     {steps: 40, long_steps: 1000, ref_long_steps: 200}
logging:  {log_dir: logs, save_every: 1}
